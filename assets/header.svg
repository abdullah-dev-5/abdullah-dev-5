<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1000" height="180" fill="#0D1117"/>

  <!-- Background grid -->
  <g stroke="#3FB950" stroke-width="1" opacity="0.10">
    <line x1="100" y1="0" x2="100" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="300" y1="0" x2="300" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="500" y1="0" x2="500" y2="180"/>
    <line x1="600" y1="0" x2="600" y2="180"/>
    <line x1="700" y1="0" x2="700" y2="180"/>
    <line x1="800" y1="0" x2="800" y2="180"/>
    <line x1="900" y1="0" x2="900" y2="180"/>

    <line x1="0" y1="45" x2="1000" y2="45"/>
    <line x1="0" y1="90" x2="1000" y2="90"/>
    <line x1="0" y1="135" x2="1000" y2="135"/>
  </g>

  <!-- Left engineering frame -->
  <rect x="0" y="0" width="10" height="180" fill="#3FB950"/>
  <rect x="28" y="0" width="4" height="72" fill="#3FB950"/>
  <rect x="28" y="108" width="4" height="72" fill="#3FB950"/>

  <!-- Right engineering frame -->
  <rect x="920" y="0" width="4" height="72" fill="#3FB950"/>
  <rect x="920" y="108" width="4" height="72" fill="#3FB950"/>
  <rect x="950" y="0" width="50" height="10" fill="#3FB950"/>
  <rect x="975" y="10" width="25" height="4" fill="#3FB950"/>

  <!-- Main accent -->
  <rect x="82" y="35" width="5" height="110" fill="#3FB950"/>

  <!-- Name -->
  <text
    x="115"
    y="78"
    fill="#F0F6FC"
    font-family="monospace"
    font-size="38"
    font-weight="700"
    letter-spacing="2">
    ABDULLAH HUSSAIN
  </text>

  <!-- Role -->
  <text
    x="118"
    y="108"
    fill="#3FB950"
    font-family="monospace"
    font-size="14"
    letter-spacing="2">
    PYTHON · DJANGO · BACKEND ENGINEERING
  </text>

  <!-- Terminal line -->
  <text
    x="118"
    y="134"
    fill="#8B949E"
    font-family="monospace"
    font-size="11">
    &gt; building systems · learning · shipping
  </text>

  <!-- Right-side technical bars -->
  <rect x="850" y="55" width="35" height="5" fill="#3FB950"/>
  <rect x="865" y="70" width="55" height="5" fill="#3FB950"/>
  <rect x="835" y="85" width="85" height="5" fill="#3FB950"/>
  <rect x="865" y="100" width="35" height="5" fill="#3FB950"/>

  <!-- Bottom engineering bar -->
  <rect x="0" y="168" width="1000" height="12" fill="#3FB950"/>
  <rect x="55" y="168" width="150" height="12" fill="#0D1117"/>
  <rect x="760" y="168" width="185" height="12" fill="#0D1117"/>

</svg>
